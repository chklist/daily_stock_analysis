name: 资金流采集诊断
on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - data_provider/base.py
      - data_provider/fundamental_adapter.py
      - tests/test_capital_flow_regression.py
      - scripts/diagnose_capital_flow.py
      - .github/workflows/02-capital-flow-check.yml
permissions:
  contents: read
jobs:
  diagnose:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      TZ: Asia/Shanghai
      PYTHONUNBUFFERED: '1'
      FUNDAMENTAL_STAGE_TIMEOUT_SECONDS: ${{ vars.FUNDAMENTAL_STAGE_TIMEOUT_SECONDS || '45' }}
      FUNDAMENTAL_FETCH_TIMEOUT_SECONDS: ${{ vars.FUNDAMENTAL_FETCH_TIMEOUT_SECONDS || '15' }}
      REALTIME_SOURCE_PRIORITY: tencent,akshare_sina,efinance,akshare_em
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v6
        with:
          python-version: '3.11'
          cache: pip
      - run: python -m pip install -r requirements.txt pytest pytest-timeout flake8
      - name: 资金流与决策保护回归测试
        run: |
          python -m pytest tests/test_fundamental_adapter.py tests/test_fundamental_context.py tests/test_capital_flow_regression.py tests/test_decision_stability.py tests/test_data_tools_get_capital_flow.py -q --timeout=90
          python -m flake8 data_provider/base.py data_provider/fundamental_adapter.py scripts/diagnose_capital_flow.py tests/test_capital_flow_regression.py --select=E9,F63,F7,F82
      - name: 沪深两只股票实测（无模型调用和通知）
        run: |
          mkdir -p logs
          set -o pipefail
          python scripts/diagnose_capital_flow.py 2>&1 | tee logs/capital-flow-check.log
      - uses: actions/upload-artifact@v6
        if: always()
        with:
          name: capital-flow-check-${{ github.run_number }}
          path: |
            reports/capital-flow-check.json
            logs/capital-flow-check.log
          retention-days: 14
